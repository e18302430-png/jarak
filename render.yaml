# نسخة مجانية: خدمة Render المجانية + قاعدة بيانات Supabase المجانية
# (الصور تنحفظ في قاعدة البيانات، فما نحتاج قرص)
services:
  - type: web
    name: jarak
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: DEMO
        value: "0"
      - key: PUBLIC_URL
        sync: false
      - key: SMS_PROVIDER
        value: dev
      - key: TAQNYAT_TOKEN
        sync: false
      - key: TAQNYAT_SENDER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MOYASAR_SECRET_KEY
        sync: false
      - key: MOYASAR_WEBHOOK_SECRET
        sync: false
